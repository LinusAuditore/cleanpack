# 推送 v* 标签时：确认标签与 core.APP_VERSION 一致，复用 CI 测试并构建，再创建草稿 Release。
# 应用没有 Developer ID 签名和公证；草稿由维护者检查后手动发布。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # 直接读 core.py 的赋值行，不在 Linux 上导入 core（它面向 macOS）。
      - name: Tag must match core.APP_VERSION
        run: |
          version="$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' core.py)"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match core.APP_VERSION ($version)"
            exit 1
          fi

  build:
    needs: check-tag
    uses: ./.github/workflows/ci.yml

  draft-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: CleanPack-macos-arm64
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum CleanPack-*-macos-arm64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" CleanPack-*-macos-arm64.zip SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "CleanPack ${GITHUB_REF_NAME#v}" --generate-notes
